name: Quietly CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel any in-progress run for the same branch/PR so we don't waste minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to create GitHub Releases

    steps:
      # ------------------------------------------------------------------ #
      # 1. Checkout full history so gradlew permissions survive the clone
      # ------------------------------------------------------------------ #
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------------ #
      # 2. Java 17 — matches compileOptions in build.gradle.kts
      # ------------------------------------------------------------------ #
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # ------------------------------------------------------------------ #
      # 3. Make gradlew executable (the checkout may strip the +x bit)
      # ------------------------------------------------------------------ #
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # ------------------------------------------------------------------ #
      # 4. Validate the Gradle wrapper (security best-practice)
      # ------------------------------------------------------------------ #
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      # ------------------------------------------------------------------ #
      # 5. Cache Gradle home + build caches between runs
      # ------------------------------------------------------------------ #
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # ------------------------------------------------------------------ #
      # 6. Run unit tests first — fail fast before spending time on the APK
      # ------------------------------------------------------------------ #
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      # ------------------------------------------------------------------ #
      # 7. Build debug APK
      # ------------------------------------------------------------------ #
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      # ------------------------------------------------------------------ #
      # 8. Read versionName from gradle for a human-readable release tag
      # ------------------------------------------------------------------ #
      - name: Extract versionName
        id: version
        run: |
          VERSION=$(./gradlew -q :app:printVersionName 2>/dev/null || \
            grep -oP '(?<=versionName = ")[^"]+' app/build.gradle.kts | head -1)
          echo "name=${VERSION}" >> "$GITHUB_OUTPUT"
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "tag=v${VERSION}-build.${{ github.run_number }}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------ #
      # 9. Upload APK as a workflow artifact (always, even on PRs)
      # ------------------------------------------------------------------ #
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quietly-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ------------------------------------------------------------------ #
      # 10. Create a versioned GitHub Release (only on pushes to main)
      #
      #     Uses softprops/action-gh-release@v2.
      #     The tag includes the run number + short SHA so it is always
      #     unique — no "tag already exists" errors from previous runs.
      # ------------------------------------------------------------------ #
      - name: Create GitHub Release with APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   ${{ steps.version.outputs.tag }}
          name:       "Quietly ${{ steps.version.outputs.name }} (build #${{ github.run_number }})"
          body: |
            ## Quietly ${{ steps.version.outputs.name }}

            Automated debug build from commit [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})

            **Branch:** `${{ github.ref_name }}`
            **Build:** #${{ github.run_number }}

            ### Install
            1. Download `app-debug.apk` below
            2. Enable *Install unknown apps* for your file manager
            3. Open the APK and install
            4. Grant **Usage Access** when prompted

            > ⚠️ This is an unsigned debug build. For production use, sign the release variant.
          files:      app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
