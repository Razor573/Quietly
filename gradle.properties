# Project-wide Gradle settings.

# AndroidX — required for all modern Android libraries
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Enables incremental annotation processing for Kotlin (speeds up Hilt/Room builds)
kapt.incremental.apt=true

# Suppress "migrate to KSP" warning for kapt
kapt.use.worker.api=true

# Non-transitive R classes — reduces build time and avoids resource conflicts
android.nonTransitiveRClass=true

# Enable Jetpack Compose metrics (optional, remove if build is slow)
# android.enableComposeCompilerMetrics=true

# Increase JVM heap for Gradle daemon to avoid OOM on large Compose builds
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
